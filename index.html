<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Soro — Practice speaking, out loud</title>
<meta name="description" content="Pick a topic, set your time, speak your mind. Soro gives you AI-powered feedback so you can think on your feet and explain ideas clearly." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --font: 'Outfit', system-ui, sans-serif;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 26px;
    --radius-pill: 999px;
    --ease: cubic-bezier(.22,.9,.32,1);
  }
  [data-theme="light"]{
    --bg: #F5F6FB;
    --bg-2: #ECEFF9;
    --surface: #FFFFFF;
    --surface-2: #F1F3FA;
    --text: #12151E;
    --text-muted: #5C6178;
    --text-faint: #9297AB;
    --border: rgba(18,21,30,0.09);
    --border-strong: rgba(18,21,30,0.16);
    --blue-500: #3D5CFF;
    --blue-600: #2A44E0;
    --blue-700: #1E33B8;
    --blue-100: #E7EBFF;
    --blue-glow: rgba(61,92,255,.28);
    --success: #16874F;
    --success-bg: #E4F6EC;
    --warn: #9A6B00;
    --warn-bg: #FBF0D6;
    --danger: #C22E45;
    --danger-bg: #FBE7EA;
    --shadow: 0 1px 2px rgba(20,24,40,.04), 0 12px 32px rgba(20,24,40,.08);
    --scrim: rgba(10,12,20,.5);
  }
  [data-theme="dark"]{
    --bg: #0A0C13;
    --bg-2: #10131D;
    --surface: #151827;
    --surface-2: #1B1F30;
    --text: #F3F4FA;
    --text-muted: #A0A5BD;
    --text-faint: #676C85;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.16);
    --blue-500: #5E7CFF;
    --blue-600: #7C97FF;
    --blue-700: #97ADFF;
    --blue-100: #1D2547;
    --blue-glow: rgba(94,124,255,.35);
    --success: #48D68F;
    --success-bg: #10281D;
    --warn: #F0BC3D;
    --warn-bg: #2C2308;
    --danger: #F0748C;
    --danger-bg: #2C1319;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 20px 48px rgba(0,0,0,.45);
    --scrim: rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
    transition: background .4s var(--ease), color .4s var(--ease);
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit;}
  button{font-family:var(--font); cursor:pointer;}
  button:disabled{cursor:not-allowed; opacity:.5;}
  input,textarea{font-family:var(--font);}
  ::selection{background:var(--blue-glow);}

  :focus-visible{ outline: 2.5px solid var(--blue-500); outline-offset: 3px; border-radius: 6px; }

  .container{max-width:1180px; margin:0 auto; padding:0 28px;}
  @media (max-width:640px){ .container{padding:0 18px;} }

  /* ---------- NAV ---------- */
  .nav{
    position: sticky; top:0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; max-width:1180px; margin:0 auto;}
  .wordmark{display:flex; align-items:center; gap:9px; font-weight:800; font-size:22px; letter-spacing:-0.02em; background:none; border:none; padding:0; color:var(--text);}
  .wordmark .o-ring{position:relative; width:9px; height:9px; border-radius:50%; background:var(--blue-500); display:inline-block;}
  .wordmark .o-ring::before, .wordmark .o-ring::after{
    content:''; position:absolute; inset:-6px; border-radius:50%; border:1.5px solid var(--blue-500); opacity:0; animation: sonar 2.6s var(--ease) infinite;
  }
  .wordmark .o-ring::after{ animation-delay: 1.3s; }
  @keyframes sonar{ 0%{ transform:scale(.5); opacity:.55;} 100%{ transform:scale(2.2); opacity:0;} }
  .nav-links{display:flex; align-items:center; gap:30px;}
  .nav-links a{font-size:14.5px; font-weight:500; color:var(--text-muted); text-decoration:none; transition:color .2s;}
  .nav-links a:hover{color:var(--text);}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .theme-toggle{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--text); transition: transform .2s var(--ease), border-color .2s;
  }
  .theme-toggle:hover{ transform: scale(1.06); border-color:var(--border-strong); }
  .btn{
    border-radius: var(--radius-pill); border:1px solid transparent; font-weight:600; font-size:15px;
    padding: 12px 22px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .16s var(--ease), box-shadow .2s, background .2s, border-color .2s, opacity .2s;
    white-space:nowrap;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{ background: var(--blue-500); color:#fff; box-shadow: 0 6px 20px var(--blue-glow); }
  .btn-primary:hover{ background: var(--blue-600); box-shadow: 0 8px 26px var(--blue-glow); transform: translateY(-1px); }
  .btn-secondary{ background: var(--surface); color:var(--text); border-color:var(--border-strong); }
  .btn-secondary:hover{ border-color: var(--blue-500); color:var(--blue-500); }
  .btn-ghost{ background:transparent; color:var(--text-muted); }
  .btn-ghost:hover{ color:var(--text); background:var(--surface-2); }
  .btn-lg{ padding:16px 30px; font-size:16.5px; }
  .btn-sm{ padding:9px 16px; font-size:13.5px; }
  .btn-block{ width:100%; }
  .nav-cta{display:inline-flex;}
  @media (max-width:860px){ .nav-links{display:none;} }
  @media (max-width:520px){ .nav-cta span{display:none;} .nav-cta{padding:12px 16px;} }

  /* ---------- HERO ---------- */
  .hero{ position:relative; padding: 96px 0 70px; overflow:hidden; }
  .hero-bg{ position:absolute; inset:0; z-index:0; pointer-events:none; }
  .hero-bg span{
    position:absolute; border-radius:50%; filter: blur(2px); opacity:.55;
    background: radial-gradient(circle at 30% 30%, var(--blue-500), transparent 70%);
    animation: float 16s ease-in-out infinite;
  }
  .hero-bg .b1{ width:340px; height:340px; top:-120px; right:-80px; animation-duration:20s;}
  .hero-bg .b2{ width:220px; height:220px; bottom:-80px; left:-60px; animation-duration:24s; animation-delay:-6s;}
  .hero-bg .b3{ width:120px; height:120px; top:40%; right:8%; animation-duration:14s; animation-delay:-3s; opacity:.35;}
  @keyframes float{ 0%,100%{ transform: translate(0,0);} 50%{ transform: translate(-22px, 26px);} }
  .hero-inner{ position:relative; z-index:1; text-align:center; max-width:760px; margin:0 auto;}
  .hero h1{
    font-size: clamp(38px, 6vw, 68px); line-height: 1.03; font-weight:800; letter-spacing:-0.03em; margin:0 0 22px;
  }
  .hero h1 .accent{ color: var(--blue-500); }
  .hero p.sub{ font-size: clamp(16px,2vw,19px); color:var(--text-muted); line-height:1.6; max-width:560px; margin:0 auto 34px; }
  .hero-actions{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:14px;}

  /* ---------- HOW IT WORKS ---------- */
  .section{ padding: 88px 0; }
  .section-head{ text-align:center; max-width:600px; margin:0 auto 56px; }
  .section-head .tag{ color:var(--blue-500); font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; }
  .section-head h2{ font-size: clamp(28px,4vw,42px); font-weight:800; letter-spacing:-0.02em; margin:10px 0 12px; }
  .section-head p{ color:var(--text-muted); font-size:16px; line-height:1.6; }
  .steps{ display:grid; grid-template-columns: repeat(5,1fr); gap:16px; position:relative;}
  @media (max-width:980px){ .steps{ grid-template-columns: repeat(2,1fr);} }
  @media (max-width:560px){ .steps{ grid-template-columns: 1fr;} }
  .step-card{
    background:var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); padding:24px 20px;
    transition: transform .25s var(--ease), border-color .25s;
  }
  .step-card:hover{ transform: translateY(-4px); border-color: var(--border-strong); }
  .step-num{ font-size:13px; font-weight:700; color:var(--blue-500); margin-bottom:14px; font-variant-numeric: tabular-nums;}
  .step-card h3{ font-size:17px; font-weight:700; margin:0 0 8px; }
  .step-card p{ font-size:14px; color:var(--text-muted); line-height:1.55; margin:0; }

  /* ---------- ABOUT ---------- */

  footer{ border-top:1px solid var(--border); padding: 30px 0; margin-top:auto;}
  .footer-inner{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; font-size:13.5px; color:var(--text-faint);}

  /* ---------- APP SHELL (setup/topic/speaking/results) ---------- */
  .app-screen{ flex:1; display:flex; flex-direction:column; }
  .center-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 20px 60px;}
  .panel{ width:100%; max-width:640px; }
  .top-bar{ display:flex; align-items:center; justify-content:space-between; padding: 20px 28px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:var(--text-muted); background:none; border:none; padding:8px 4px;}
  .back-link:hover{ color:var(--text); }

  .fade-in{ animation: fadeIn .5s var(--ease) both; }
  .fade-up{ animation: fadeUp .55s var(--ease) both; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fadeUp{ from{opacity:0; transform: translateY(16px);} to{opacity:1; transform:translateY(0);} }

  .progress-dots{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:30px;}
  .progress-dots .dot{ width:8px; height:8px; border-radius:50%; background:var(--border-strong); transition: all .3s var(--ease);}
  .progress-dots .dot.active{ background:var(--blue-500); width:22px; border-radius:5px;}
  .progress-dots .dot.done{ background: var(--blue-300, var(--blue-500)); opacity:.5;}

  .setup-title{ text-align:center; font-size: clamp(22px,3.4vw,30px); font-weight:800; letter-spacing:-0.02em; margin:0 0 8px;}
  .setup-sub{ text-align:center; color:var(--text-muted); font-size:15px; margin:0 0 34px;}

  .chip-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:16px;}
  @media (max-width:560px){ .chip-grid{ grid-template-columns: repeat(2,1fr);} }
  .chip{
    display:flex; align-items:center; gap:9px; padding:14px 14px; border-radius:14px; border:1.5px solid var(--border);
    background:var(--surface); font-size:14.5px; font-weight:600; color:var(--text); text-align:left;
    transition: all .18s var(--ease);
  }
  .chip:hover{ border-color: var(--blue-500); transform: translateY(-2px); }
  .chip.selected{ border-color: var(--blue-500); background: var(--blue-100); color: var(--blue-600); }
  [data-theme="dark"] .chip.selected{ color: var(--blue-700); }

  .custom-row{ display:flex; gap:10px; margin: 6px 0 18px; }
  .custom-row input{
    flex:1; padding:14px 16px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--text); font-size:14.5px; outline:none; transition: border-color .2s;
  }
  .custom-row input:focus{ border-color: var(--blue-500); }
  .surprise-row{ text-align:center; margin: 8px 0 6px;}
  .link-btn{ background:none; border:none; color:var(--blue-500); font-weight:600; font-size:14.5px; padding:8px; }
  .link-btn:hover{ text-decoration: underline; }

  .option-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:26px;}
  .option-row{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-radius:14px;
    border:1.5px solid var(--border); background:var(--surface); text-align:left; transition: all .18s var(--ease); width:100%;
  }
  .option-row:hover{ border-color: var(--blue-500); }
  .option-row.selected{ border-color: var(--blue-500); background: var(--blue-100); }
  .option-row .ot{ font-weight:700; font-size:15px; }
  .option-row .od{ font-size:12.5px; color:var(--text-muted); margin-top:2px;}
  [data-theme="dark"] .option-row.selected .ot{ color: var(--blue-700); }
  .option-row .check{ width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .option-row.selected .check{ background: var(--blue-500); border-color: var(--blue-500); }

  .dur-grid{ display:grid; grid-template-columns: repeat(5,1fr); gap:8px; margin-bottom:26px;}
  @media (max-width:560px){ .dur-grid{ grid-template-columns: repeat(3,1fr);} }
  .dur-chip{
    padding:16px 6px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); font-weight:700; font-size:15px;
    text-align:center; transition: all .18s var(--ease);
  }
  .dur-chip small{ display:block; font-weight:500; font-size:11px; color:var(--text-faint); margin-top:2px;}
  .dur-chip:hover{ border-color:var(--blue-500);}
  .dur-chip.selected{ border-color:var(--blue-500); background:var(--blue-100); color:var(--blue-600); }
  [data-theme="dark"] .dur-chip.selected{ color:var(--blue-700); }

  .setup-actions{ display:flex; gap:12px; margin-top:8px;}

  /* ---------- TOPIC SCREEN ---------- */
  .topic-card{
    background:var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding: 46px 34px; text-align:center; box-shadow: var(--shadow); position:relative; overflow:hidden;
  }
  .topic-meta{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; flex-wrap:wrap;}
  .pill{ font-size:12px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; padding:6px 12px; border-radius:var(--radius-pill); background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border);}
  .pill.blue{ background:var(--blue-100); color:var(--blue-600);}
  [data-theme="dark"] .pill.blue{ color:var(--blue-700); }
  .topic-label{ font-size:13px; color:var(--text-faint); font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-bottom:14px;}
  .topic-word{ font-size: clamp(30px,5.4vw,46px); font-weight:800; letter-spacing:-0.02em; line-height:1.15; margin:0 0 8px; min-height:1.2em;}
  .topic-time{ display:inline-flex; align-items:center; gap:8px; font-size:15px; color:var(--text-muted); font-weight:600; margin: 18px 0 4px;}
  .topic-actions{ display:flex; flex-direction:column; gap:10px; margin-top:30px;}
  .topic-actions .row2{ display:flex; gap:10px; }
  .topic-actions .row2 .btn{ flex:1; }

  .prep-box{ margin-top:22px; text-align:left; }
  .prep-box summary{ cursor:pointer; font-size:14px; font-weight:600; color:var(--text-muted); list-style:none; display:flex; align-items:center; gap:8px; padding:6px 0;}
  .prep-box summary::-webkit-details-marker{ display:none; }
  .prep-box summary:hover{ color:var(--text); }
  .prep-box textarea{
    width:100%; margin-top:10px; min-height:110px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2);
    color:var(--text); padding:14px 16px; font-size:14.5px; font-family:var(--font); resize:vertical; outline:none;
  }
  .prep-box textarea:focus{ border-color:var(--blue-500); }

  .topic-loading{ padding: 60px 20px; text-align:center; }
  .spinner{
    width:44px; height:44px; border-radius:50%; border:3px solid var(--border); border-top-color: var(--blue-500);
    margin: 0 auto 22px; animation: spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .loading-msg{ font-size:15px; color:var(--text-muted); font-weight:500; min-height:20px;}

  .err-box{
    background: var(--danger-bg); border:1px solid color-mix(in srgb, var(--danger) 40%, transparent); color:var(--danger);
    border-radius:14px; padding:16px 18px; font-size:14px; text-align:left; margin: 20px 0; display:flex; gap:10px; align-items:flex-start;
  }
  .err-box svg{ flex-shrink:0; margin-top:1px;}
  .err-box .err-actions{ margin-top:10px; display:flex; gap:8px;}

  /* ---------- SPEAKING SCREEN ---------- */
  .speak-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 30px 20px 50px; text-align:center; position:relative;}
  .speak-topic-tag{ font-size:13px; color:var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
  .speak-topic{ font-size: clamp(24px,4vw,34px); font-weight:800; letter-spacing:-0.02em; margin:0 0 40px; max-width:640px;}

  .timer-ring-wrap{ position:relative; width:220px; height:220px; margin: 0 auto 34px;}
  .timer-ring-wrap svg{ transform: rotate(-90deg); width:100%; height:100%;}
  .timer-ring-bg{ fill:none; stroke:var(--border); stroke-width:6;}
  .timer-ring-fg{ fill:none; stroke:var(--blue-500); stroke-width:6; stroke-linecap:round; transition: stroke-dashoffset 1s linear;}
  .timer-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .timer-num{ font-size:38px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.02em;}
  .timer-label{ font-size:12px; color:var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .mic-indicator{ display:flex; align-items:center; gap:10px; margin-bottom:22px; font-size:13.5px; font-weight:600; color:var(--text-muted);}
  .mic-dot{ width:9px; height:9px; border-radius:50%; background: var(--danger); }
  .mic-dot.live{ background: var(--success); animation: pulseDot 1.4s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{ box-shadow: 0 0 0 0 var(--success-bg);} 50%{ box-shadow: 0 0 0 6px transparent;} }

  .waveform{ display:flex; align-items:flex-end; gap:4px; height:52px; margin-bottom:34px; }
  .waveform .bar{ width:4px; border-radius:3px; background: var(--blue-500); height:6px; transition: height .09s ease-out; }

  .live-caption{
    max-width:560px; min-height:48px; color:var(--text-muted); font-size:14.5px; line-height:1.6; margin-bottom:30px; padding:0 10px;
  }
  .live-caption .interim{ color:var(--text-faint); }

  .speak-actions{ display:flex; gap:12px; align-items:center;}
  .finish-btn{
    width:76px; height:76px; border-radius:50%; background:var(--danger); color:#fff; border:none; display:flex;
    align-items:center; justify-content:center; box-shadow: 0 8px 26px rgba(194,46,69,.35); transition: transform .18s var(--ease);
  }
  .finish-btn:hover{ transform: scale(1.06); }
  .finish-btn:active{ transform: scale(.95); }
  .finish-hint{ font-size:12.5px; color:var(--text-faint); margin-top:12px;}

  .manual-transcript{ max-width:520px; width:100%; margin: 0 auto 20px; text-align:left;}
  .manual-transcript label{ font-size:13px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:8px;}
  .manual-transcript textarea{ width:100%; min-height:140px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); padding:14px; font-family:var(--font); font-size:14.5px;}

  /* ---------- RESULTS ---------- */
  .results-wrap{ max-width:720px; margin:0 auto; padding: 40px 20px 70px;}
  .results-head{ text-align:center; margin-bottom:36px;}
  .results-head h2{ font-size: clamp(26px,4vw,34px); font-weight:800; letter-spacing:-0.02em; margin:0 0 8px;}
  .results-head p{ color:var(--text-muted); font-size:14.5px;}
  .metric-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:12px; margin-bottom:30px;}
  @media (max-width:640px){ .metric-grid{ grid-template-columns: repeat(2,1fr);} }
  .metric-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 14px; text-align:center; }
  .metric-val{ font-size:24px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}
  .metric-lbl{ font-size:12px; color:var(--text-muted); font-weight:600; margin-top:5px;}
  .metric-delta{ font-size:11px; font-weight:700; margin-top:6px; display:inline-block; padding:2px 8px; border-radius:var(--radius-pill);}
  .metric-delta.up{ color:var(--success); background:var(--success-bg);}
  .metric-delta.down{ color:var(--danger); background:var(--danger-bg);}

  .card-block{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px; margin-bottom:16px;}
  .card-block h3{ font-size:15px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .card-block p{ font-size:14.5px; line-height:1.65; color:var(--text-muted); margin:0;}
  .card-block.good{ border-color: color-mix(in srgb, var(--success) 30%, var(--border)); }
  .card-block.good h3{ color: var(--success); }
  .card-block.improve h3{ color: var(--warn); }
  .card-block.improve{ border-color: color-mix(in srgb, var(--warn) 30%, var(--border)); }

  .filler-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .filler-tag{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-pill); padding:6px 12px; font-size:13px; font-weight:600; color:var(--text);}
  .filler-tag b{ color:var(--blue-500); font-weight:800; margin-left:4px;}
  .structure-flow{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:14px; font-weight:600; }
  .structure-flow span.step{ background:var(--blue-100); color:var(--blue-600); padding:7px 12px; border-radius:10px;}
  [data-theme="dark"] .structure-flow span.step{ color:var(--blue-700); }
  .structure-flow .arrow{ color:var(--text-faint); }

  .results-actions{ display:flex; gap:12px; margin-top:26px; flex-wrap:wrap;}
  .results-actions .btn{ flex:1; min-width:150px;}

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body data-theme="light">
<div id="app"></div>

<script>
/* ============================= STATE ============================= */
const NICHES = [
  {key:'product-design', label:'Product Design'},
  {key:'technology', label:'Technology'},
  {key:'business', label:'Business'},
  {key:'psychology', label:'Psychology'},
  {key:'entertainment', label:'Entertainment'},
  {key:'science', label:'Science'},
  {key:'finance', label:'Finance'},
  {key:'marketing', label:'Marketing'},
  {key:'history', label:'History'},
  {key:'sports', label:'Sports'},
  {key:'books', label:'Books'},
  {key:'personal-development', label:'Personal Growth'},
];
const DIFFICULTIES = [
  {key:'beginner', label:'Beginner', desc:'Common, foundational topics'},
  {key:'intermediate', label:'Intermediate', desc:'More specific and nuanced'},
  {key:'advanced', label:'Advanced', desc:'Complex, specialized topics'},
];
const DURATIONS = [
  {sec:60, label:'1 min'}, {sec:120, label:'2 min'}, {sec:180, label:'3 min'},
  {sec:300, label:'5 min'}, {sec:600, label:'10 min'},
];
const LOADING_MSGS_TOPIC = ["Thinking of something interesting…","Digging through the archive…","Picking something worth saying out loud…"];
const LOADING_MSGS_ANALYSIS = ["Analyzing your response…","Finding your speaking patterns…","Counting the ums and ahs…","Weighing structure and clarity…"];

const FILLERS = ["um","umm","uh","uhh","erm","like","basically","actually","literally","you know","i mean","so yeah","kind of","sort of","right","okay so","i guess","or whatever","and stuff","you know what i mean"];

const state = {
  theme: 'light',
  screen: 'landing', // landing | setup | topic | speaking | results
  setupStep: 0, // 0 niche 1 difficulty 2 duration
  niche: null, nicheLabel: '', customNiche: '',
  difficulty: 'intermediate',
  duration: 180,
  usedTopics: [],
  currentTopic: '',
  topicLoading: false, topicError: null,
  notes: '',
  // speaking
  micState: 'idle', // idle|requesting|denied|live|unsupported
  recognitionSupported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
  transcriptFinal: '', transcriptInterim: '',
  timeLeft: 180, timerHandle: null, speakStart: null, actualSpokenSec: 0,
  lastPauseTs: null, pauseCount: 0,
  manualTranscript: '',
  // results
  analysisLoading: false, analysisError: null,
  results: null,
  attemptHistory: {}, // topic -> [ {fillerCount,wpm,pace,relevanceScore,ts} ]
  attemptNumber: 1,
};

/* ============================= STORAGE / THEME ============================= */
async function loadTheme(){
  try{
    const r = await window.storage.get('soro-theme', false);
    if(r && (r.value === 'dark' || r.value === 'light')) state.theme = r.value;
  }catch(e){ /* no stored pref yet */ }
  document.body.setAttribute('data-theme', state.theme);
}
async function toggleTheme(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.body.setAttribute('data-theme', state.theme);
  try{ await window.storage.set('soro-theme', state.theme, false); }catch(e){}
  renderThemeIcon();
}
function renderThemeIcon(){
  const el = document.getElementById('themeIconWrap');
  if(el) el.innerHTML = state.theme === 'light' ? iconMoon() : iconSun();
}

/* ============================= ICONS ============================= */
function iconMoon(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'; }
function iconSun(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'; }
function iconMic(sz){ sz=sz||20; return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>`; }
function iconAlert(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>'; }
function iconCheck(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'; }
function iconStop(){ return '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'; }
function iconBack(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'; }
function iconRefresh(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>'; }

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================= NAV / SHELL ============================= */
function shellNav(){
  return `
  <nav class="nav">
    <div class="nav-inner">
      <button class="wordmark" onclick="goLanding()" aria-label="Soro home">
        <span class="o-ring"></span>SORO
      </button>
      <div class="nav-links">
        <a href="#practice" onclick="scrollToId(event,'practice')">Practice</a>
        <a href="#how" onclick="scrollToId(event,'how')">How It Works</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
          <span id="themeIconWrap">${state.theme === 'light' ? iconMoon() : iconSun()}</span>
        </button>
        <button class="btn btn-primary nav-cta" onclick="startPractice()"><span>Start Practicing</span></button>
      </div>
    </div>
  </nav>`;
}
function scrollToId(e,id){ e.preventDefault(); const el = document.getElementById(id); if(el) el.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto':'smooth'}); }

/* ============================= LANDING ============================= */
function renderLanding(){
  return `
  ${shellNav()}
  <section class="hero" id="practice">
    <div class="hero-bg" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
    <div class="container hero-inner">
      <h1 class="fade-up">Practice talking<br/>about what you <span class="accent">know.</span></h1>
      <p class="sub fade-up" style="animation-delay:.08s">Choose a topic, set your time, speak your mind — and get AI-powered feedback that helps you communicate more clearly.</p>
      <div class="hero-actions fade-up" style="animation-delay:.16s">
        <button class="btn btn-primary btn-lg" onclick="startPractice()">Start speaking</button>
        <button class="btn btn-secondary btn-lg" onclick="scrollToId(event,'how')">See how it works</button>
      </div>
    </div>
  </section>

  <section class="section" id="how">
    <div class="container">
      <div class="section-head">
        <span class="tag">The flow</span>
        <h2>Choose → Generate → Speak → Improve</h2>
        <p>Five short steps stand between you and a sharper, more confident voice.</p>
      </div>
      <div class="steps">
        ${stepCard('01','Pick a topic','Choose a niche, type your own, or let Soro surprise you.')}
        ${stepCard('02','Get one topic','One single word or concept to research and think through — no lists, no trick questions.')}
        ${stepCard('03','Speak','Set your time, hit record, and explain it in your own words.')}
        ${stepCard('04','Get feedback','AI analyzes filler words, pacing, relevance, clarity and structure.')}
        ${stepCard('05','Improve','Try the same topic again and watch your numbers move.')}
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <span>Soro — practice speaking, out loud.</span>
      <span>Built for thinking on your feet.</span>
    </div>
  </footer>
  `;
}
function stepCard(num,title,desc){
  return `<div class="step-card"><div class="step-num">${num}</div><h3>${title}</h3><p>${desc}</p></div>`;
}

/* ============================= SETUP ============================= */
function startPractice(){
  state.screen = 'setup'; state.setupStep = 0;
  render();
}
function goLanding(){ state.screen = 'landing'; render(); window.scrollTo({top:0}); }

function renderSetup(){
  const stepsHtml = [renderSetupNiche, renderSetupDifficulty, renderSetupDuration][state.setupStep]();
  return `
  <div class="app-screen fade-in">
    <div class="top-bar">
      <button class="back-link" onclick="setupBack()">${iconBack()} Back</button>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"><span id="themeIconWrap">${state.theme === 'light' ? iconMoon() : iconSun()}</span></button>
    </div>
    <div class="center-wrap">
      <div class="panel">
        <div class="progress-dots">
          ${[0,1,2].map(i => `<div class="dot ${i===state.setupStep?'active':(i<state.setupStep?'done':'')}"></div>`).join('')}
        </div>
        ${stepsHtml}
      </div>
    </div>
  </div>`;
}
function setupBack(){
  if(state.setupStep === 0){ goLanding(); return; }
  state.setupStep--; render();
}
function renderSetupNiche(){
  return `
  <h2 class="setup-title">What do you want to talk about?</h2>
  <p class="setup-sub">Pick a niche, or make it your own.</p>
  <div class="chip-grid">
    ${NICHES.map(n => `
      <button class="chip ${state.niche===n.key ? 'selected':''}" onclick="pickNiche('${n.key}','${escapeHtml(n.label)}')">
        <span>${n.label}</span>
      </button>`).join('')}
  </div>
  <div class="custom-row">
    <input id="customNicheInput" type="text" placeholder="Or type any niche — e.g. Afrobeats, Football tactics…"
      value="${escapeHtml(state.customNiche)}" oninput="onCustomNicheInput(this.value)"
      onkeydown="if(event.key==='Enter'){ if(this.value.trim()) advanceSetup(); }" aria-label="Custom niche"/>
  </div>
  <div class="surprise-row">
    <button class="link-btn" onclick="pickSurprise()">🎲 Surprise me — pick anything</button>
  </div>
  <div class="setup-actions" style="margin-top:22px;">
    <button class="btn btn-primary btn-block btn-lg" ${state.niche ? '' : 'disabled'} onclick="advanceSetup()">Continue</button>
  </div>
  `;
}
function pickNiche(key,label){
  state.niche = key; state.nicheLabel = label; state.customNiche='';
  render();
}
function onCustomNicheInput(v){
  state.customNiche = v;
  if(v.trim()){ state.niche = 'custom'; state.nicheLabel = v.trim(); }
  else if(state.niche === 'custom'){ state.niche = null; state.nicheLabel=''; }
  // avoid full re-render (keeps input focus) — just update chip states + button
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  const btn = document.querySelector('.setup-actions .btn-primary');
  if(btn) btn.disabled = !state.niche;
}
function pickSurprise(){
  state.niche = 'surprise'; state.nicheLabel = 'Surprise Me'; state.customNiche='';
  advanceSetup();
}
function advanceSetup(){
  if(!state.niche) return;
  state.setupStep++; render();
}
function renderSetupDifficulty(){
  return `
  <h2 class="setup-title">Choose a difficulty</h2>
  <p class="setup-sub">This shapes how specialized your topic will be.</p>
  <div class="option-list">
    ${DIFFICULTIES.map(d => `
      <button class="option-row ${state.difficulty===d.key?'selected':''}" onclick="pickDifficulty('${d.key}')">
        <span><span class="ot">${d.label}</span><br/><span class="od">${d.desc}</span></span>
        <span class="check">${state.difficulty===d.key ? iconCheck() : ''}</span>
      </button>`).join('')}
  </div>
  <div class="setup-actions">
    <button class="btn btn-primary btn-block btn-lg" onclick="advanceSetup2()">Continue</button>
  </div>
  `;
}
function pickDifficulty(key){ state.difficulty = key; render(); }
function advanceSetup2(){ state.setupStep++; render(); }

function renderSetupDuration(){
  return `
  <h2 class="setup-title">How long do you want to speak?</h2>
  <p class="setup-sub">This sets your timer once you start.</p>
  <div class="dur-grid">
    ${DURATIONS.map(d => `
      <button class="dur-chip ${state.duration===d.sec?'selected':''}" onclick="pickDuration(${d.sec})">${d.label}</button>`).join('')}
  </div>
  <div class="setup-actions">
    <button class="btn btn-primary btn-block btn-lg" onclick="beginTopicGeneration()">Generate my topic</button>
  </div>
  `;
}
function pickDuration(sec){ state.duration = sec; state.timeLeft = sec; render(); }

/* ============================= TOPIC GENERATION ============================= */
async function beginTopicGeneration(){
  state.screen = 'topic';
  state.topicLoading = true; state.topicError = null; state.currentTopic = '';
  render();
  await generateTopic();
}
async function generateTopic(){
  state.topicLoading = true; state.topicError = null; render();
  try{
    const nicheContext = state.niche === 'surprise'
      ? 'any interesting general-knowledge subject (pick freely across domains — could be design, science, history, culture, sports, everyday life, etc.)'
      : state.nicheLabel;
    const avoid = state.usedTopics.length ? `Do not repeat or closely resemble any of these already-used topics: ${state.usedTopics.join(', ')}.` : '';
    const diffGuide = {
      beginner: 'a common, foundational, widely-known term or concept that a newcomer to this subject would encounter early on',
      intermediate: 'a more specific, nuanced term or concept — something a person with working knowledge of the subject would know',
      advanced: 'a complex, specialized, or less commonly discussed term or concept within this subject',
    }[state.difficulty];

    const prompt = `You generate a single speaking-practice topic for a tool called Soro. The user picked the niche/subject: "${nicheContext}". Difficulty level: ${state.difficulty} — meaning ${diffGuide}.

Respond with ONLY one single word, short term, or concept (max 4 words) that a person could research briefly and then explain out loud in their own words. It must NOT be a question, a full sentence, an instruction, or a list. Do not add quotation marks, punctuation at the end, labels, or any explanation — output nothing but the topic itself.
${avoid}`;

    const res = await callClaude(prompt, 60);
    const topic = cleanTopicText(res);
    if(!topic) throw new Error('empty');
    state.currentTopic = topic;
    state.usedTopics.push(topic);
    state.topicLoading = false;
    state.timeLeft = state.duration;
    state.notes = '';
    render();
  }catch(e){
    state.topicLoading = false;
    state.topicError = 'Soro couldn\'t come up with a topic just now. This is usually a brief connection hiccup.';
    render();
  }
}
function cleanTopicText(t){
  if(!t) return '';
  let s = t.trim().split('\n')[0];
  s = s.replace(/^["'“”‘’]+|["'“”‘’]+$/g,'').replace(/[.:;]+$/,'').trim();
  if(s.length > 80) s = s.slice(0,80);
  return s;
}
async function callClaude(userText, maxTokens){
  const response = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt: userText, maxTokens: maxTokens || 1000 })
  });
  if(!response.ok) throw new Error('api_error_' + response.status);
  const data = await response.json();
  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
  return textBlocks.join('\n').trim();
}

/* ============================= TOPIC SCREEN ============================= */
function renderTopicScreen(){
  const durLabel = DURATIONS.find(d=>d.sec===state.duration)?.label || '';
  let inner;
  if(state.topicLoading){
    const msg = LOADING_MSGS_TOPIC[Math.floor(Math.random()*LOADING_MSGS_TOPIC.length)];
    inner = `
      <div class="topic-card topic-loading">
        <div class="spinner"></div>
        <p class="loading-msg" id="loadingMsg">${msg}</p>
      </div>`;
  } else if(state.topicError){
    inner = `
      <div class="topic-card">
        <div class="err-box" role="alert">
          ${iconAlert()}
          <div>
            <div>${state.topicError}</div>
            <div class="err-actions">
              <button class="btn btn-primary btn-sm" onclick="generateTopic()">Try again</button>
            </div>
          </div>
        </div>
      </div>`;
  } else {
    inner = `
      <div class="topic-card fade-up">
        <div class="topic-meta">
          <span class="pill blue">${escapeHtml(state.nicheLabel)}</span>
          <span class="pill">${state.difficulty}</span>
        </div>
        <div class="topic-label">Your topic</div>
        <h1 class="topic-word" id="topicWord">${escapeHtml(state.currentTopic)}</h1>
        <div class="topic-time">${iconClock()} ${durLabel} to speak</div>
        <details class="prep-box">
          <summary>${iconPencil()} Add prep notes (optional)</summary>
          <textarea placeholder="Jot down what you already know, or a quick outline…" oninput="state.notes=this.value">${escapeHtml(state.notes)}</textarea>
        </details>
        <div class="topic-actions">
          <button class="btn btn-primary btn-lg btn-block" onclick="goToSpeaking()">Start speaking</button>
          <div class="row2">
            <button class="btn btn-secondary" onclick="generateTopic()">${iconRefresh()} Generate another</button>
            <button class="btn btn-ghost" onclick="backFromTopic()">Change setup</button>
          </div>
        </div>
      </div>`;
  }
  return `
  <div class="app-screen fade-in">
    <div class="top-bar">
      <button class="back-link" onclick="backFromTopic()">${iconBack()} Back</button>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"><span id="themeIconWrap">${state.theme === 'light' ? iconMoon() : iconSun()}</span></button>
    </div>
    <div class="center-wrap"><div class="panel">${inner}</div></div>
  </div>`;
}
function iconClock(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'; }
function iconPencil(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'; }
function backFromTopic(){ state.screen='setup'; state.setupStep=0; render(); }

/* ============================= SPEAKING ============================= */
let recognition = null, audioCtx=null, analyser=null, micStream=null, rafId=null, dataArr=null;

function goToSpeaking(){
  state.screen = 'speaking';
  state.transcriptFinal = ''; state.transcriptInterim = '';
  state.manualTranscript = '';
  state.timeLeft = state.duration;
  state.micState = 'requesting';
  state.actualSpokenSec = 0; state.pauseCount = 0; state.lastPauseTs = null;
  render();
  requestMicAndStart();
}

async function requestMicAndStart(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    state.micState = 'live';
    setupWaveform(micStream);
    setupRecognition();
    startTimer();
    render();
  }catch(err){
    state.micState = 'denied';
    render();
  }
}
function setupWaveform(stream){
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    src.connect(analyser);
    dataArr = new Uint8Array(analyser.frequencyBinCount);
    animateWaveform();
  }catch(e){ /* waveform is cosmetic; ignore failures */ }
}
function animateWaveform(){
  const bars = document.querySelectorAll('#waveform .bar');
  if(!bars.length || !analyser){ rafId = requestAnimationFrame(animateWaveform); return; }
  analyser.getByteFrequencyData(dataArr);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  bars.forEach((bar, i) => {
    const v = dataArr[i % dataArr.length] || 0;
    const h = reduce ? 10 : Math.max(6, (v/255)*52);
    bar.style.height = h + 'px';
  });
  rafId = requestAnimationFrame(animateWaveform);
}
function stopWaveform(){
  if(rafId) cancelAnimationFrame(rafId);
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
}
function setupRecognition(){
  if(!state.recognitionSupported) return;
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new R();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  let lastEventTs = Date.now();
  recognition.onresult = (event) => {
    const now = Date.now();
    const gap = (now - lastEventTs)/1000;
    if(gap > 2.5 && state.transcriptFinal.trim().length > 0){ state.pauseCount++; }
    lastEventTs = now;
    let interim = '', final='';
    for(let i=event.resultIndex; i<event.results.length; i++){
      const t = event.results[i][0].transcript;
      if(event.results[i].isFinal) final += t + ' ';
      else interim += t;
    }
    if(final) state.transcriptFinal += final;
    state.transcriptInterim = interim;
    updateCaption();
  };
  recognition.onerror = (e) => { if(e.error === 'not-allowed'){ state.micState='denied'; render(); } };
  recognition.onend = () => { if(state.screen==='speaking' && state.micState==='live'){ try{ recognition.start(); }catch(e){} } };
  try{ recognition.start(); }catch(e){}
}
function updateCaption(){
  const el = document.getElementById('liveCaption');
  if(!el) return;
  const words = (state.transcriptFinal + ' ' + state.transcriptInterim).trim().split(/\s+/).filter(Boolean);
  const tail = words.slice(-26).join(' ');
  el.innerHTML = state.transcriptFinal.trim() || state.transcriptInterim
    ? escapeHtml(tail) + (state.transcriptInterim ? '' : '')
    : '<span class="interim">Start talking — your words will appear here…</span>';
}
function startTimer(){
  state.speakStart = Date.now();
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(() => {
    state.timeLeft--;
    updateTimerUI();
    if(state.timeLeft <= 0){ finishSpeaking(); }
  }, 1000);
}
function updateTimerUI(){
  const numEl = document.getElementById('timerNum');
  const ring = document.getElementById('timerRingFg');
  if(numEl){
    const m = Math.max(0,Math.floor(state.timeLeft/60)); const s = Math.max(0,state.timeLeft%60);
    numEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
  }
  if(ring){
    const total = state.duration; const frac = Math.max(0,state.timeLeft)/total;
    const circumference = 2*Math.PI*100;
    ring.style.strokeDashoffset = circumference * (1-frac);
  }
}
function renderSpeakingScreen(){
  const circumference = 2*Math.PI*100;
  let body;
  if(state.micState === 'denied'){
    body = `
      <div class="err-box" role="alert" style="max-width:480px; margin:0 auto;">
        ${iconAlert()}
        <div>
          <div><strong>Microphone access is blocked.</strong> Soro needs your mic to hear you speak. Check your browser's site settings and allow microphone access, then try again.</div>
          <div class="err-actions">
            <button class="btn btn-primary btn-sm" onclick="requestMicAndStart()">Try again</button>
            <button class="btn btn-secondary btn-sm" onclick="useManualMode()">Type instead</button>
          </div>
        </div>
      </div>`;
  } else if(state.micState === 'requesting'){
    body = `<div class="spinner" style="margin:40px auto;"></div><p class="loading-msg">Requesting microphone access…</p>`;
  } else {
    body = `
      <div class="mic-indicator"><span class="mic-dot live"></span> ${state.recognitionSupported ? 'Listening' : 'Recording'}</div>
      <div class="timer-ring-wrap">
        <svg viewBox="0 0 220 220">
          <circle class="timer-ring-bg" cx="110" cy="110" r="100"/>
          <circle class="timer-ring-fg" id="timerRingFg" cx="110" cy="110" r="100"
            stroke-dasharray="${circumference}" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-center">
          <div class="timer-num" id="timerNum">${fmtTime(state.timeLeft)}</div>
          <div class="timer-label">remaining</div>
        </div>
      </div>
      <div class="waveform" id="waveform" aria-hidden="true">
        ${Array.from({length:26}).map(()=> '<div class="bar"></div>').join('')}
      </div>
      <div class="live-caption" id="liveCaption" aria-live="polite">
        ${state.recognitionSupported ? '<span class="interim">Start talking — your words will appear here…</span>' : 'Live transcription isn\'t available in this browser — you\'ll type what you said after you finish.'}
      </div>
      <div class="speak-actions">
        <button class="finish-btn" onclick="finishSpeaking()" aria-label="Finish speaking">${iconStop()}</button>
      </div>
      <div class="finish-hint">Tap to finish early</div>
    `;
  }
  return `
  <div class="speak-wrap fade-in">
    <div class="speak-topic-tag">Your topic</div>
    <h1 class="speak-topic">${escapeHtml(state.currentTopic)}</h1>
    ${body}
  </div>`;
}
function fmtTime(sec){ sec=Math.max(0,sec); const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,'0')}`; }
function useManualMode(){ state.micState='live'; state.recognitionSupported=false; state.timeLeft=state.duration; startTimer(); render(); }

async function finishSpeaking(){
  clearInterval(state.timerHandle);
  state.actualSpokenSec = Math.max(1, state.duration - Math.max(0,state.timeLeft));
  if(recognition){
    try{
      recognition.onend=null;
      recognition.stop();
      // give the recognizer a brief moment to flush its last final result
      await new Promise(r => setTimeout(r, 400));
    }catch(e){}
    recognition=null;
  }
  stopWaveform();
  if(!state.recognitionSupported && !state.manualTranscript){
    // show manual entry screen
    state.screen = 'manualEntry';
    render();
    return;
  }
  state.screen = 'results';
  state.analysisLoading = true; state.analysisError = null; state.results = null;
  render();
  await runAnalysis();
}
function renderManualEntry(){
  return `
  <div class="speak-wrap fade-in">
    <div class="speak-topic-tag">Your topic</div>
    <h1 class="speak-topic">${escapeHtml(state.currentTopic)}</h1>
    <div class="manual-transcript">
      <label for="manualTa">Type roughly what you said (auto-transcription isn't available in this browser)</label>
      <textarea id="manualTa" oninput="state.manualTranscript=this.value" placeholder="Type here…"></textarea>
    </div>
    <button class="btn btn-primary btn-lg" onclick="submitManual()">Get my feedback</button>
  </div>`;
}
function submitManual(){
  state.transcriptFinal = state.manualTranscript || '';
  state.screen='results'; state.analysisLoading=true; state.analysisError=null; state.results=null;
  render();
  runAnalysis();
}

/* ============================= ANALYSIS ============================= */
function detectFillers(text){
  const t = ' ' + text.toLowerCase().replace(/[.,!?]/g,' ') + ' ';
  const counts = {};
  FILLERS.forEach(f => {
    const re = new RegExp('\\b' + f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','g');
    const m = t.match(re);
    if(m && m.length) counts[f] = m.length;
  });
  return counts;
}
function computePace(transcript, seconds){
  const words = transcript.trim().split(/\s+/).filter(Boolean).length;
  const minutes = Math.max(seconds,1)/60;
  const wpm = Math.round(words/minutes);
  let pace = 'Moderate';
  if(wpm < 110) pace = 'Slow'; else if(wpm > 165) pace = 'Fast';
  return {words, wpm, pace};
}
async function runAnalysis(){
  const transcript = (state.transcriptFinal + ' ' + state.transcriptInterim).trim() || state.manualTranscript.trim();
  const clientFillers = detectFillers(transcript);
  const paceInfo = computePace(transcript || '', state.actualSpokenSec);

  if(!transcript || transcript.split(/\s+/).filter(Boolean).length < 4){
    state.analysisLoading = false;
    state.analysisError = "Soro didn't catch enough speech to analyze. Try again and speak a bit longer, or check your microphone.";
    render();
    return;
  }

  try{
    const prompt = `You are the analysis engine behind Soro, a speaking-practice tool. A user was given the topic "${state.currentTopic}" (niche: ${state.nicheLabel}, difficulty: ${state.difficulty}) and spoke for about ${Math.round(state.actualSpokenSec)} seconds. Here is their transcribed speech:

"""${transcript}"""

Evaluate it and respond with ONLY valid JSON (no markdown fences, no extra text) matching exactly this shape:
{
 "relevanceScore": <integer 0-100, how directly they addressed the topic>,
 "relevanceLabel": <"Excellent"|"Good"|"Fair"|"Needs Work">,
 "clarity": <"High"|"Medium"|"Low">,
 "structureNote": <one short sentence on whether the response had a logical progression>,
 "doWell": <1-2 specific sentences on what they did well — cite something concrete from their actual response, not generic praise>,
 "improve": <1-2 specific, actionable sentences on the single most useful thing to improve next time>,
 "suggestedStructure": <a short arrow-separated structure appropriate to how they should approach this kind of topic, e.g. "Definition → Why it matters → Example → Conclusion" or "Position → Reason → Example → Conclusion" or "Problem → Cause → Impact → Solution", adapted to fit>,
 "extraFillers": [{"phrase": <string>, "count": <integer>}],
 "repeatedPhrases": [{"phrase": <string>, "count": <integer>}]
}
Only include entries in extraFillers for genuine filler words/phrases NOT already in this list: ${FILLERS.join(', ')}. Keep extraFillers and repeatedPhrases arrays short (max 4 items each), and empty arrays if none apply.`;

    const raw = await callClaude(prompt, 700);
    const json = parseJsonLoose(raw);

    const mergedFillers = {...clientFillers};
    (json.extraFillers||[]).forEach(f=>{
      if(f && f.phrase) mergedFillers[f.phrase.toLowerCase()] = (mergedFillers[f.phrase.toLowerCase()]||0) + (f.count||1);
    });
    const totalFillers = Object.values(mergedFillers).reduce((a,b)=>a+b,0);

    const results = {
      transcript,
      duration: state.actualSpokenSec,
      totalDuration: state.duration,
      fillers: mergedFillers,
      totalFillers,
      wpm: paceInfo.wpm,
      pace: paceInfo.pace,
      relevanceScore: clamp(json.relevanceScore ?? 70, 0, 100),
      relevanceLabel: json.relevanceLabel || 'Good',
      clarity: json.clarity || 'Medium',
      structureNote: json.structureNote || '',
      doWell: json.doWell || 'You stayed on topic and got your core idea across.',
      improve: json.improve || 'Try adding one concrete example next time to ground your explanation.',
      suggestedStructure: json.suggestedStructure || 'Definition → Why it matters → Example → Conclusion',
      repeatedPhrases: json.repeatedPhrases || [],
      pauseCount: state.pauseCount,
    };
    state.results = results;
    state.analysisLoading = false;

    // history for comparisons
    const key = state.currentTopic.toLowerCase();
    if(!state.attemptHistory[key]) state.attemptHistory[key] = [];
    state.attemptNumber = state.attemptHistory[key].length + 1;
    state.attemptHistory[key].push(results);

    render();
  }catch(e){
    state.analysisLoading = false;
    state.analysisError = "Soro couldn't analyze your response just now — that's usually a brief connection hiccup, not a problem with what you said.";
    render();
  }
}
function clamp(v,a,b){ v=Number(v); if(isNaN(v)) v=a; return Math.max(a,Math.min(b,v)); }
function parseJsonLoose(raw){
  let s = raw.trim();
  s = s.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = s.indexOf('{'); const end = s.lastIndexOf('}');
  if(start>=0 && end>start) s = s.slice(start,end+1);
  return JSON.parse(s);
}

/* ============================= RESULTS ============================= */
function renderResultsScreen(){
  if(state.analysisLoading){
    const msg = LOADING_MSGS_ANALYSIS[Math.floor(Math.random()*LOADING_MSGS_ANALYSIS.length)];
    return `
    <div class="results-wrap">
      <div class="topic-card topic-loading">
        <div class="spinner"></div>
        <p class="loading-msg">${msg}</p>
      </div>
    </div>`;
  }
  if(state.analysisError){
    return `
    <div class="results-wrap">
      <div class="err-box" role="alert">
        ${iconAlert()}
        <div>
          <div>${state.analysisError}</div>
          <div class="err-actions">
            <button class="btn btn-primary btn-sm" onclick="runAnalysis()">Try again</button>
            <button class="btn btn-secondary btn-sm" onclick="backToTopicFromResults()">Back to topic</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  const r = state.results;
  const key = state.currentTopic.toLowerCase();
  const history = state.attemptHistory[key] || [];
  const prev = history.length >= 2 ? history[history.length-2] : null;

  const fillerEntries = Object.entries(r.fillers).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]);

  return `
  <div class="results-wrap fade-up">
    <div class="results-head">
      <h2>Your Results</h2>
      <p>${escapeHtml(state.currentTopic)} · ${escapeHtml(state.nicheLabel)} · Attempt ${state.attemptNumber}</p>
    </div>

    <div class="metric-grid">
      ${metricCard(fmtTime(Math.round(r.duration)) + ' / ' + fmtTime(r.totalDuration), 'Speaking time', null)}
      ${metricCard(r.totalFillers, 'Filler words', prev ? deltaBadge(prev.totalFillers, r.totalFillers, true) : null)}
      ${metricCard(r.pace, 'Speaking pace', null)}
      ${metricCard(r.relevanceLabel, 'Topic relevance', prev ? deltaBadge(prev.relevanceScore, r.relevanceScore, false) : null)}
    </div>

    ${fillerEntries.length ? `
    <div class="card-block">
      <h3>Filler words</h3>
      <div class="filler-tags">
        ${fillerEntries.map(([w,c]) => `<span class="filler-tag">"${escapeHtml(w)}" <b>× ${c}</b></span>`).join('')}
      </div>
    </div>` : `
    <div class="card-block good"><h3>${iconCheck()} Filler words</h3><p>Barely any filler words detected — clean delivery.</p></div>`}

    ${r.repeatedPhrases.length ? `
    <div class="card-block">
      <h3>Repetition</h3>
      <div class="filler-tags">
        ${r.repeatedPhrases.map(p => `<span class="filler-tag">"${escapeHtml(p.phrase)}" <b>× ${p.count}</b></span>`).join('')}
      </div>
    </div>` : ''}

    <div class="card-block good">
      <h3>${iconCheck()} You did well</h3>
      <p>${escapeHtml(r.doWell)}</p>
    </div>

    <div class="card-block improve">
      <h3>${iconAlert()} Try improving</h3>
      <p>${escapeHtml(r.improve)}</p>
    </div>

    <div class="card-block">
      <h3>Suggested structure</h3>
      <div class="structure-flow">
        ${r.suggestedStructure.split('→').map((s,i,arr)=> `<span class="step">${escapeHtml(s.trim())}</span>` + (i<arr.length-1? '<span class="arrow">→</span>':'')).join('')}
      </div>
      ${r.structureNote ? `<p style="margin-top:12px;">${escapeHtml(r.structureNote)}</p>` : ''}
    </div>

    ${prev ? renderImprovement(prev, r) : ''}

    <div class="results-actions">
      <button class="btn btn-primary btn-lg" onclick="tryAgainSameTopic()">Try again</button>
      <button class="btn btn-secondary btn-lg" onclick="newTopicSameSetup()">New topic</button>
      <button class="btn btn-ghost btn-lg" onclick="goLanding()">Done</button>
    </div>
  </div>`;
}
function metricCard(val,lbl,delta){
  return `<div class="metric-card"><div class="metric-val">${val}</div><div class="metric-lbl">${lbl}</div>${delta||''}</div>`;
}
function deltaBadge(prevV, curV, lowerIsBetter){
  const diff = curV - prevV;
  if(diff === 0) return '';
  const better = lowerIsBetter ? diff < 0 : diff > 0;
  const arrow = diff > 0 ? '↑' : '↓';
  return `<span class="metric-delta ${better?'up':'down'}">${arrow} ${Math.abs(diff)}</span>`;
}
function renderImprovement(prev, cur){
  return `
  <div class="card-block">
    <h3>Your improvement</h3>
    <div style="display:flex; flex-direction:column; gap:10px; font-size:14.5px;">
      <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted);">Filler words</span><strong>${prev.totalFillers} → ${cur.totalFillers}</strong></div>
      <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted);">Speaking pace</span><strong>${prev.pace} → ${cur.pace}</strong></div>
      <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-muted);">Topic relevance</span><strong>${prev.relevanceScore}% → ${cur.relevanceScore}%</strong></div>
    </div>
  </div>`;
}
function backToTopicFromResults(){ state.screen='topic'; render(); }
function tryAgainSameTopic(){
  state.screen = 'speaking';
  goToSpeaking();
}
function newTopicSameSetup(){
  state.screen = 'topic';
  beginTopicGeneration();
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.screen){
    case 'landing': html = renderLanding(); break;
    case 'setup': html = renderSetup(); break;
    case 'topic': html = renderTopicScreen(); break;
    case 'speaking': html = renderSpeakingScreen(); break;
    case 'manualEntry': html = renderManualEntry(); break;
    case 'results': html = renderResultsScreen(); break;
    default: html = renderLanding();
  }
  app.innerHTML = html;
  if(state.screen === 'setup' && state.setupStep === 0){
    const input = document.getElementById('customNicheInput');
    if(input && document.activeElement !== input){ /* keep as-is */ }
  }
  if(state.screen === 'speaking' && state.micState === 'live'){
    updateTimerUI();
    updateCaption();
  }
}

(async function init(){
  await loadTheme();
  render();
})();
</script>
</body>
</html>
